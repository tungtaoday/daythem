<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GieoChữ — Người dùng thật</title>
<style>
 :root{--bg:#0c0c0d;--card:#141416;--card2:#1c1c1f;--line:#2e2e33;--t0:#fff;--t1:#d4d4d8;--t2:#a1a1aa;
       --green:#22c4a0;--amber:#e8a020;--red:#ef4444;--blue:#3b82f6}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--t0);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      line-height:1.55;padding:18px 14px 40px}
 .wrap{max-width:860px;margin:0 auto}
 h1{font-size:21px;margin:0 0 4px}
 .sub{color:var(--t2);font-size:12.5px;margin-bottom:18px}
 .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
 .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
 .kpi b{display:block;font-size:24px;line-height:1.2}
 .kpi span{color:var(--t2);font-size:11.5px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
 .name{font-size:16px;font-weight:700}
 .meta{color:var(--t2);font-size:12px;margin-top:2px}
 .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
 .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--t1)}
 .chip.on{background:rgba(34,196,160,.14);border-color:var(--green);color:var(--green)}
 .stages{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
 .st{flex:1;min-width:64px;text-align:center;font-size:10.5px;padding:5px 4px;border-radius:6px;
     background:var(--card2);color:var(--t2);border:1px solid var(--line)}
 .st.done{background:rgba(34,196,160,.14);color:var(--green);border-color:var(--green)}
 .alert{margin-top:11px;padding:10px 12px;border-radius:8px;background:rgba(232,160,32,.10);
        border:1px solid rgba(232,160,32,.35);font-size:12.5px;color:var(--amber)}
 .alert b{color:#f5c86a}
 .ok{margin-top:11px;font-size:12.5px;color:var(--green)}
 .jbtn{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--t2);
       width:auto;padding:6px 12px;font-size:12px;font-weight:500;border-radius:7px}
 .jwrap{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
 .sess{margin-bottom:10px;padding:9px 10px;background:var(--card2);border-radius:8px}
 .shead{font-size:11.5px;color:var(--t2);margin-bottom:6px}
 .path{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
 .stp{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--card);
      border:1px solid var(--line);color:var(--t1)}
 .stp.act{background:rgba(34,196,160,.14);border-color:var(--green);color:var(--green)}
 .arw{color:var(--t2);font-size:11px}
 .bnc{color:var(--amber)}
 .dead{margin-top:10px;font-size:12.5px}
 .dead b{color:var(--amber)}
 .quiet0{color:var(--green)} .quiet1{color:var(--amber)} .quiet2{color:var(--red)}
 #login{max-width:320px;margin:60px auto;text-align:center}
 input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--t0);font-size:15px}
 button{margin-top:10px;width:100%;padding:11px;border-radius:9px;border:0;background:var(--green);color:#04231c;font-weight:700;font-size:14px;cursor:pointer}
 .lnk{background:transparent;color:var(--t2);border:1px solid var(--line);font-weight:400}
 .err{color:var(--red);font-size:12.5px;margin-top:8px}
</style></head><body>

<div id="login">
 <h1>Người dùng thật</h1>
 <div class="sub">Nhập mật khẩu quản trị</div>
 <input id="pw" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter')doLogin()">
 <button onclick="doLogin()">Vào</button>
 <div class="err" id="lerr"></div>
</div>

<div class="wrap" id="app" style="display:none">
 <h1>👥 Người dùng thật</h1>
 <div class="sub" id="sub">Đang tải…</div>
 <div class="kpis" id="kpis"></div>
 <div id="dropoff"></div>
 <div id="list"></div>
 <button class="lnk" onclick="load()">Làm mới</button>
 <button class="lnk" onclick="logout()">Đăng xuất</button>
</div>

<script>
const KEY='gc_admin_tok';
const tok=()=>localStorage.getItem(KEY);
function show(a){document.getElementById('app').style.display=a?'block':'none';
                 document.getElementById('login').style.display=a?'none':'block';}
async function doLogin(){
 const pw=document.getElementById('pw').value;
 const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
 if(!r.ok){document.getElementById('lerr').textContent='Sai mật khẩu';return;}
 localStorage.setItem(KEY,(await r.json()).token);show(true);load();
}
function logout(){localStorage.removeItem(KEY);show(false);}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Chặng đường phải KHỚP STAGES trong user_health.py
const STAGES=['đăng ký','tạo lớp','thêm HS','điểm danh','thu phí','báo cáo'];

function quietTxt(d){
 if(d===0) return '<span class="quiet0">hoạt động hôm nay</span>';
 if(d<=3)  return '<span class="quiet0">'+d+' ngày trước</span>';
 if(d<=7)  return '<span class="quiet1">im '+d+' ngày</span>';
 return '<span class="quiet2">im '+d+' ngày</span>';
}

async function load(){
 const r=await fetch('/admin/users',{headers:{'Authorization':'Bearer '+tok()}});
 if(r.status===401){logout();return;}
 const d=await r.json();

 document.getElementById('sub').innerHTML=
   'Đã loại <b>'+d.excluded+'</b> tài khoản thử / seed / tester đổi chéo — '+
   'chỉ hiện người dùng thật.';
 document.getElementById('kpis').innerHTML=
   '<div class="kpi"><b>'+d.real_total+'</b><span>người dùng thật</span></div>'+
   '<div class="kpi"><b style="color:var(--green)">'+d.real_active+'</b><span>dùng đều (≥2 ngày, còn hoạt động)</span></div>'+
   '<div class="kpi"><b style="color:var(--amber)">'+d.users.filter(u=>u.stuck).length+'</b><span>cần gọi</span></div>';

 document.getElementById('list').innerHTML = d.users.length ? d.users.map(u=>{
   const si=STAGES.indexOf(u.stage);
   const stages=STAGES.map((s,i)=>'<div class="st'+(i<=si?' done':'')+'">'+esc(s)+'</div>').join('');
   const feats=Object.entries(u.features||{}).sort((a,b)=>b[1]-a[1])
        .map(([k,v])=>'<span class="chip on">'+esc(k)+' · '+v+'</span>').join('')
        || '<span class="chip">chưa dùng tính năng nào</span>';
   const box=u.stuck
     ? '<div class="alert">⚠️ <b>'+esc(u.stuck)+'</b><br>→ '+esc(u.action)+'</div>'
     : '<div class="ok">✓ '+esc(u.action)+'</div>';
   return '<div class="card">'+
     '<div class="name">'+esc(u.name)+'</div>'+
     '<div class="meta">'+esc(u.phone)+' · vào '+u.days_since_join+' ngày trước · '+
       u.active_days+' ngày có dùng · '+quietTxt(u.days_quiet)+'</div>'+
     '<div class="row"><span class="chip">'+u.classes+' lớp</span>'+
       '<span class="chip">'+u.students+' học sinh</span>'+
       '<span class="chip">'+u.events+' thao tác</span></div>'+
     '<div class="stages">'+stages+'</div>'+
     '<div class="row">'+feats+'</div>'+
     box+
     '<button class="jbtn" onclick="journey(this,\''+esc(u.teacher_id)+'\')">👣 Xem bước chân trong app</button>'+
     '<div class="jwrap" id="j_'+esc(u.teacher_id)+'" style="display:none"></div>'+
     '</div>';
 }).join('') : '<div class="card">Chưa có người dùng thật nào.</div>';

 loadDropOff();
}

/** Đường đi từng phiên của một GV — thứ cho biết họ lạc ở đâu trước khi bỏ. */
async function journey(btn, tid){
 const box=document.getElementById('j_'+tid);
 if(box.style.display==='block'){ box.style.display='none'; btn.textContent='👣 Xem bước chân trong app'; return; }
 box.style.display='block'; box.innerHTML='<div class="shead">đang tải…</div>';
 btn.textContent='👣 Ẩn bước chân';
 const r=await fetch('/admin/journey?teacher_id='+encodeURIComponent(tid),
                     {headers:{'Authorization':'Bearer '+tok()}});
 if(r.status===401){logout();return;}
 const d=await r.json();
 const ss=d.sessions||[];
 if(!ss.length){
   box.innerHTML='<div class="shead">Chưa có bước chân nào. App bản này chưa gửi — '
     +'người dùng cần cập nhật lên bản có đo hành trình.</div>';
   return;
 }
 box.innerHTML=ss.map(s=>{
   const path=s.steps.map(t=>{
     const isAct=t.indexOf(' · ')>-1;
     return '<span class="stp'+(isAct?' act':'')+'">'+esc(t)+'</span>';
   }).join('<span class="arw">→</span>');
   const when=new Date(s.started).toLocaleString('vi-VN');
   return '<div class="sess"><div class="shead">'+esc(when)+' · '+s.seconds+'s · '
     +s.screens+' màn · '+s.actions+' thao tác'
     +(s.bounced?' · <span class="bnc">mở rồi thoát, không bấm gì</span>':'')
     +'</div><div class="path">'+path+'</div></div>';
 }).join('');
}

/** Ngõ cụt toàn cục: màn nào người ta nhìn xong rồi thoát. */
async function loadDropOff(){
 const el=document.getElementById('dropoff');
 const r=await fetch('/admin/journey',{headers:{'Authorization':'Bearer '+tok()}});
 if(!r.ok){el.innerHTML='';return;}
 const rows=(await r.json()).drop_off||[];
 if(!rows.length){
   el.innerHTML='<div class="card"><b>👣 Ngõ cụt</b><div class="sub" style="margin:6px 0 0">'
     +'Chưa có dữ liệu bước chân — cần bản app có đo hành trình.</div></div>';
   return;
 }
 el.innerHTML='<div class="card"><b>👣 Màn hình người ta thoát tại đó (30 ngày)</b>'
   +rows.slice(0,6).map(x=>'<div class="dead">• <b>'+esc(x.screen)+'</b> — '
     +x.ends+' phiên kết thúc ở đây / '+x.views+' lượt mở ('+x.end_rate+'%)</div>').join('')
   +'</div>';
}

if(tok()){show(true);load();}else{show(false);}
</script>
</body></html>
